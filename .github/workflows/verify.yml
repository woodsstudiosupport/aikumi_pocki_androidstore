name: Verify foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python tools/release.py --check
      - run: npx playwright install --with-deps chromium
      - name: Check browser flow
        run: |
          python -m http.server 8765 --directory remote > /tmp/aikumi-preview.log 2>&1 &
          npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: aikumi-ui-screenshots
          path: /tmp/aikumi-*.png
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: bash gradlew testDebugUnitTest assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: aikumi-foundation-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
